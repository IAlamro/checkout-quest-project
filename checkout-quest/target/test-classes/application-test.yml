spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # Stop at V9 — V10 is a partial unique index that H2 in-memory does not support.
    # Application-level idempotency checks still apply in tests.
    target: 9

scheduling:
  outbox-relay-interval-ms: 9999999
